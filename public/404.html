<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Evan Klein</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #faf9f7;
        --fg: #1a1c1e;
        --muted: #5c6066;
        --primary: #1f3a5f;
        --accent: #b5542e;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1217;
          --fg: #e6e8eb;
          --muted: #a3a8b0;
          --primary: #9cc0ee;
          --accent: #f0a07c;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      main {
        max-width: 32rem;
        padding: 24px 16px;
      }

      .code {
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.875rem;
      }

      h1 {
        font-size: 2rem;
        margin: 0.5rem 0 0.75rem;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }

      a {
        color: var(--primary);
        font-weight: 600;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>
        The link you followed may be from an older version of this site. Everything current lives on
        the home page.
      </p>
      <nav>
        <a href="/">Go to evanklein.tech</a>
        <a href="https://www.linkedin.com/in/elklein96">LinkedIn</a>
        <a href="mailto:elklein96@gmail.com">Email</a>
      </nav>
    </main>
  </body>
</html>
